# Catppuccin preset — floating bar, Iosevka, soft rounding.

barstyle = floating
radius = 12
uiradius = 12
borders = on
shadows = on
blur = on
opacity = 90
animations = on
gaps = 6
gaps_out = 12
scale = 100
font-ui = Iosevka Nerd Font
font-app = Iosevka Nerd Font
font-size-ui = 10
font-size-app = 10
