# Gruvbox preset — retro blocky bar, JetBrains Mono.

barstyle = blocky
radius = 8
uiradius = 8
borders = on
shadows = on
blur = on
opacity = 94
animations = on
gaps = 6
gaps_out = 12
scale = 100
font-ui = JetBrainsMono Nerd Font
font-app = JetBrainsMono Nerd Font
font-size-ui = 9
font-size-app = 9
