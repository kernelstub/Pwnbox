# Monochrome preset — same baseline as Pwnbox, pure grayscale palette.

barstyle = islands
workspaces = dots
radius = 9
uiradius = 9
borders = on
shadows = on
blur = on
opacity = 92
animations = on
gaps = 5
gaps_out = 10
scale = 100
font-ui = IoskeleyMono Nerd Font
font-app = IoskeleyMono Nerd Font
font-size-ui = 9
font-size-app = 9
