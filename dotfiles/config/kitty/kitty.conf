
font_family      Iosevka Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 9.0

background_opacity 1.0
inactive_text_alpha 1.0
window_padding_width 25
remember_window_size no
confirm_os_window_close 0

scrollback_lines 10000
scrollbar never
wheel_scroll_multiplier 3.0
cursor_shape beam
cursor_blink_interval 0.5
cursor_shape_unfocused unchanged

cursor_trail 3
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 2
cursor_trail_color #cccccc

background #080808
foreground #cccccc
selection_background #353535
selection_foreground #080808
cursor #cccccc

color0  #171717
color1  #6b6b6b
color2  #c4c4c4
color3  #999999
color4  #999999
color5  #717171
color6  #8a8a8a
color7  #cccccc

color8  #353535
color9  #6b6b6b
color10 #c4c4c4
color11 #999999
color12 #999999
color13 #717171
color14 #8a8a8a
color15 #cccccc

window_border_width 1px
draw_minimal_borders yes
draw_window_borders_for_single_window no
active_border_color   #252525
inactive_border_color #252525

tab_bar_background      #080808
active_tab_background   #080808
active_tab_foreground   #ffffff
inactive_tab_background #080808
inactive_tab_foreground #999999

enabled_layouts splits

map ctrl+shift+e launch --location=vsplit --cwd=current
map ctrl+shift+o launch --location=hsplit --cwd=current

map ctrl+shift+t new_tab
map ctrl+page_down next_tab
map ctrl+page_up prev_tab
map ctrl+shift+page_down move_tab_forward
map ctrl+shift+page_up move_tab_backward

map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

map ctrl+shift+w close_window
map ctrl+shift+q close_os_window

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map ctrl+shift+z toggle_layout stack
map ctrl+plus  increase_font_size
map ctrl+minus decrease_font_size
map ctrl+0     reset_font_size
map f11        toggle_fullscreen

include @HOME@/.cache/pwnbox/theme/kitty.conf
