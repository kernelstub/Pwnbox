
$mod = SUPER

env = XCURSOR_THEME,Colloid-dark-cursors
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = QT_AUTO_SCREEN_SCALE_FACTOR,0
@TIMEZONE@
monitor = , @RESOLUTION@, auto, 1
@MAINMONITOR@@SECONDARYMONITOR@

exec-once = sh -c 'awww-daemon & sleep 0.5; awww img ~/.config/hypr/wall.png --transition-type none'
exec-once = sh -c 'sleep 1; ~/.scripts/pwnbox-theme restore'
exec-once = hypridle
exec-once = sh -c 'sleep 2; ~/.scripts/pwnbox-vdesk sync'
exec-once = hyprpolkitagent
exec-once = qs -n
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(252525ff)
    col.inactive_border = rgba(252525ff)
    layout = dwindle
    resize_on_border = false
    allow_tearing = false
}

decoration {
    rounding = 9
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 13
        render_power = 3
        color = rgba(00000055)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = true
    }
}

layerrule = blur on, ignore_alpha 0.4, match:namespace quickshell
layerrule = blur on, ignore_alpha 0.4, match:namespace rofi

animations {
    enabled = true
    bezier = easeOut, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, easeOut
    animation = windowsOut, 1, 4, easeOut, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, easeOut, slide

    animation = layers, 1, 3, easeOut, fade
    animation = layersOut, 1, 2, easeOut, fade
}

dwindle {
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

cursor {
    # Software cursors: on AMD GPUs hardware cursors cause cursor ghosting /
    # trails (Hyprland renders the pointer plane itself instead). This is how
    # older pwnbox builds behaved; do not re-enable hardware cursors on AMD.
    no_hardware_cursors = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
        tap-to-click = true
    }
}

windowrule {
    name = tile-on-open
    match:class = .*
    suppress_event = fullscreen maximize
}

bind = ALT, T, exec, kitty
bind = ALT, D, exec, equibop
bind = ALT, F, exec, zen
bind = ALT, M, exec, kitty cmus
bind = ALT, C, exec, sh -c "$HOME/Documents/AppImages/Cutter*.AppImage"
bind = ALT SHIFT, 0, exec, sh -c "$HOME/Documents/AppImages/session*.AppImage"
bind = SUPER, E, exec, nautilus
bind = SUPER, S, exec, gnome-control-center
bind = SUPER, W, exec, sh -c 'export EDITOR=micro MICRO_TRUECOLOR=1 && kitty ranger'
bind = ALT, SPACE, exec, rofi -show drun
bind = SUPER SHIFT, 0, exec, ~/.scripts/pwnbox-screenshot clipboard
bind = ALT, S, exec, qs ipc call controlcenter open theme

bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

bind = ALT, Z, killactive
bind = SUPER ALT, Q, exit
bind = SUPER ALT, R, exec, hyprctl reload
bind = SUPER, V, layoutmsg, togglesplit
bind = SUPER, F, fullscreen, 0
bind = SUPER SHIFT, F, fullscreen, 1
bind = SUPER, T, togglefloating
bind = SUPER, P, pseudo

bind = SUPER CTRL, 1, layoutmsg, splitratio 0.1
bind = SUPER CTRL, 2, layoutmsg, splitratio 0.2
bind = SUPER CTRL, 3, layoutmsg, splitratio 0.3
bind = SUPER CTRL, 4, layoutmsg, splitratio 0.4
bind = SUPER CTRL, 5, layoutmsg, splitratio 0.5
bind = SUPER CTRL, 6, layoutmsg, splitratio 0.6
bind = SUPER CTRL, 7, layoutmsg, splitratio 0.7
bind = SUPER CTRL, 8, layoutmsg, splitratio 0.8
bind = SUPER CTRL, 9, layoutmsg, splitratio 0.9

bind = SUPER, Left, movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER, Up, movefocus, u
bind = SUPER, Down, movefocus, d
bind = SUPER SHIFT, Left, movewindow, l
bind = SUPER SHIFT, Right, movewindow, r
bind = SUPER SHIFT, Up, movewindow, u
bind = SUPER SHIFT, Down, movewindow, d

bind = SUPER CTRL, Left, resizeactive, -40 0
bind = SUPER CTRL, Right, resizeactive, 40 0
bind = SUPER CTRL, Up, resizeactive, 0 -40
bind = SUPER CTRL, Down, resizeactive, 0 40
bind = SUPER ALT, Left, resizeactive, 40 0
bind = SUPER ALT, Right, resizeactive, -40 0
bind = SUPER ALT, Up, resizeactive, 0 40
bind = SUPER ALT, Down, resizeactive, 0 -40

bind = ALT SHIFT, Left, moveactive, -40 0
bind = ALT SHIFT, Right, moveactive, 40 0
bind = ALT SHIFT, Up, moveactive, 0 -40
bind = ALT SHIFT, Down, moveactive, 0 40

bind = ALT, 1, exec, ~/.scripts/pwnbox-vdesk 1
bind = ALT, 2, exec, ~/.scripts/pwnbox-vdesk 2
bind = ALT, 3, exec, ~/.scripts/pwnbox-vdesk 3
bind = ALT, 4, exec, ~/.scripts/pwnbox-vdesk 4
bind = ALT, 5, exec, ~/.scripts/pwnbox-vdesk 5
bind = ALT, 6, exec, ~/.scripts/pwnbox-vdesk 6
bind = ALT, 7, exec, ~/.scripts/pwnbox-vdesk 7
bind = ALT, 8, exec, ~/.scripts/pwnbox-vdesk 8
bind = ALT, 9, exec, ~/.scripts/pwnbox-vdesk 9
bind = ALT, 0, exec, ~/.scripts/pwnbox-vdesk 10
bind = SUPER, 1, exec, ~/.scripts/pwnbox-vdesk move 1
bind = SUPER, 2, exec, ~/.scripts/pwnbox-vdesk move 2
bind = SUPER, 3, exec, ~/.scripts/pwnbox-vdesk move 3
bind = SUPER, 4, exec, ~/.scripts/pwnbox-vdesk move 4
bind = SUPER, 5, exec, ~/.scripts/pwnbox-vdesk move 5
bind = SUPER, 6, exec, ~/.scripts/pwnbox-vdesk move 6
bind = SUPER, 7, exec, ~/.scripts/pwnbox-vdesk move 7
bind = SUPER, 8, exec, ~/.scripts/pwnbox-vdesk move 8
bind = SUPER, 9, exec, ~/.scripts/pwnbox-vdesk move 9
bind = SUPER, 0, exec, ~/.scripts/pwnbox-vdesk move 10

bind = CTRL ALT, Left, exec, ~/.scripts/pwnbox-vdesk prev
bind = CTRL ALT, Right, exec, ~/.scripts/pwnbox-vdesk next

bind = SUPER, L, exec, hyprlock
bind = SUPER, ESCAPE, exec, sh -c 'qs ipc call powermenu toggle || wlogout'
bind = SUPER, grave, exec, sh -c 'cliphist list | fuzzel --dmenu | cliphist decode | wl-copy'
bind = , Print, exec, ~/.scripts/pwnbox-screenshot clipboard
bind = SUPER SHIFT, S, exec, sh -c 'qs ipc call screenshot toggle || pwnbox-screenshot clipboard'
bind = SUPER SHIFT, R, exec, ~/.scripts/pwnbox-screenshot save
bindr = SUPER, SUPER_L, exec, qs ipc call controlcenter toggle

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

source = @HOME@/.cache/pwnbox/theme/hyprland.conf
