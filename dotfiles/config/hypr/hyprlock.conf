
background {
    monitor =
    path = ~/.config/hypr/wall.png
    blur_passes = 2
    color = rgba(8, 8, 8, 1.0)
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    rounding = 10
    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true
    outer_color = rgba(37, 37, 37, 1.0)
    inner_color = rgba(8, 8, 8, 1.0)
    font_color = rgb(204, 204, 204)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(204, 204, 204)
    font_size = 56
    font_family = Manrope
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(153, 153, 153)
    font_size = 16
    font_family = Manrope
    position = 0, 70
    halign = center
    valign = center
}
